name: Minimal workflow for CI/CD
permissions:
  contents: read
  pull-requests: write
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  integration_tests:
    strategy:
      matrix:
        pgversion:
          #- 14
          #- 15
          #- 16
          #- 17
          - 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: update to docker-compose v2
        run: |
          sudo apt-get install -y curl
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: start DB2 (background)
        run: |
          n=0
          until [ "$n" -ge 5 ]; do
            docker-compose up -d db2 && break
            n=$((n+1))
            echo "docker-compose up -d db2 failed (attempt $n/5), retrying in 30s..."
            sleep 30
          done
          if [ "$n" -ge 5 ]; then
            echo "docker-compose up -d db2 failed after $n attempts"
            exit 1
          fi
        env:
          PGVERSION: ${{ matrix.pgversion }}

      - name: create rpms folder
        run: |
          mkdir -p rpms
          chmod 777 rpms

      - name: build rpm
        run: |
          docker-compose build --no-cache builder
          docker-compose up builder --exit-code-from builder
        env:
          PGVERSION: ${{ matrix.pgversion }}

      - name: Run rpm signer
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PGVERSION: ${{ matrix.pgversion }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_B64: ${{ secrets.GPG_KEY_B64 }}
        run: docker-compose up rpmsigner --exit-code-from rpmsigner

      - name: copy rpm to postgres context
        run: |
          cp -av rpms docker/postgres/

      - name: start postgres
        run: |
          docker-compose up postgres -d
        env:
          PGVERSION: ${{ matrix.pgversion }}

      - name: wait for db2 and postgres
        run: |
          set -x
          for ((i=0;i<60;i++)); do
            docker-compose exec postgres /usr/pgsql-${{ matrix.pgversion }}/bin/pg_isready && break
            sleep 1
          done
          for ((i=0;i<60;i++)); do
            docker-compose exec db2 ls /database/config/db2inst1/sqllib/ctrl/db2strst.lck
            sleep 1
          done
          docker-compose logs db2
          docker-compose exec db2 sh -c "ps -ef"
        env:
          PGVERSION: ${{ matrix.pgversion }}
